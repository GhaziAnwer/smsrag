# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name chatai.sl-sail.com;
    return 301 https://$host$request_uri;
}

# HTTPS vhost
server {
    listen 443 ssl http2;
    server_name chatai.sl-sail.com;

    add_header Content-Security-Policy "frame-ancestors 'self' https://sailerp.sl-sail.com https://erp.sl-sail.com" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    ssl_certificate     /etc/letsencrypt/live/chatai.sl-sail.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chatai.sl-sail.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    #─────────────────────────────────────────────────────────────────────────
    # DYNAMIC TENANT API: /<client>/api/*
    #─────────────────────────────────────────────────────────────────────────
    location ~ ^/([a-zA-Z0-9_-]+)/api(/.*)?$ {
        include proxy_params;
        proxy_pass http://127.0.0.1:8000/$1/api$2$is_args$args;
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    #─────────────────────────────────────────────────────────────────────────
    # LEGACY URL REWRITE: /docs/{client_id}/{file} → /{client_id}/docs/{file}
    # Old conversations stored URLs in this format; redirect to correct path
    #─────────────────────────────────────────────────────────────────────────
    location ~ ^/docs/([a-zA-Z0-9_-]+)/(.+)$ {
        rewrite ^/docs/([a-zA-Z0-9_-]+)/(.+)$ /$1/docs/$2 permanent;
    }

    # OLD DOCS FORMAT CATCH-ALL: /docs/* without client → 404
    location ~ ^/docs/ {
        default_type application/json;
        return 404 '{"error": "Document not found. Use /{client_id}/docs/{filename} format."}';
    }

    #─────────────────────────────────────────────────────────────────────────
    # TENANT DOCS (CORRECT FORMAT): /{client_id}/docs/{filename}
    # Pass request URI as-is to FastAPI (preserves %20 encoding)
    #─────────────────────────────────────────────────────────────────────────
    location ~ ^/[a-zA-Z0-9_-]+/docs/ {
        include proxy_params;
        proxy_pass http://127.0.0.1:8000;
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    #─────────────────────────────────────────────────────────────────────────
    # GLOBAL API: /api/feedback/*, /api/dashboard/*, etc.
    #─────────────────────────────────────────────────────────────────────────
    location ^~ /api/ {
        include         proxy_params;
        proxy_pass      http://127.0.0.1:8000/api/;
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    #─────────────────────────────────────────────────────────────────────────
    # DASHBOARD & FEEDBACK STATIC PAGES
    #─────────────────────────────────────────────────────────────────────────
    location = /login.html {
        root /opt/sms-rag/static;
        try_files /login.html =404;
        expires 1h;
    }

    location = /dashboard.html {
        root /opt/sms-rag/static;
        try_files /dashboard.html =404;
        expires 1h;
    }

    location = /feedback-dashboard.html {
        root /opt/sms-rag/static;
        try_files /feedback-dashboard.html =404;
        expires 1h;
    }

    location = /feedback-integration.js {
        root /opt/sms-rag/static;
        try_files /feedback-integration.js =404;
        expires 1h;
        add_header Content-Type "application/javascript";
    }

    #─────────────────────────────────────────────────────────────────────────
    # SIRE VIQ API
    #─────────────────────────────────────────────────────────────────────────
    location ^~ /sire-viq/api/ {
        include proxy_params;
        proxy_pass http://127.0.0.1:8001/;
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization";
        if ($request_method = OPTIONS) {
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    # SIRE VIQ Frontend
    location ^~ /sire-viq/ {
        alias /home/ubuntu/viq-frontend/;
        try_files $uri $uri/ index.html;
        expires 1h;
        add_header X-Content-Type-Options "nosniff"    always;
    }

    location ^~ /admin/ {
        include proxy_params;
        proxy_pass http://127.0.0.1:8001/admin/;
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    #─────────────────────────────────────────────────────────────────────────
    # SPA ROOT: Catch-all serves index.html for multi-tenant frontend
    #─────────────────────────────────────────────────────────────────────────
    location / {
        root /opt/sms-rag/static;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header X-Content-Type-Options "nosniff"    always;
    }
}
