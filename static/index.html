<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat To SMS Docs – Safe Lanes</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- ── NAV BAR ─────────────────────────────────────────────── -->
<header class="nav glass">
  <div class="brand"><span class="logo">⚓</span> Safe Lanes</div>

  <div class="nav-actions" id="navActions">
    <button id="history-btn" class="action" title="Chat History"><i class="i-history"></i><span>History</span></button>
    <button id="new-chat" class="action" title="New Chat"><i class="i-plus"></i><span>New</span></button>
    <!-- badge injected by script.js -->
  </div>
</header>

<p class="notice">AI answers can be inaccurate – always verify.</p>

<!-- ── WORKSPACE (chat | viewer) ───────────────────────────── -->
<main class="workspace">

  <!-- CHAT -->
  <section class="chat glass">
    <h2 class="page-title">Chat To SMS Docs</h2>
    <!-- <p class="page-subtitle">Start a conversation by asking anything about your SMS documents.</p> -->

    <ul id="messages" class="messages"></ul>

    <form id="chat-form" class="composer glass">
      <textarea id="chat-input" placeholder="Ask anything …" rows="1" spellcheck="true"></textarea>
      <button id="send-btn" title="Send"><i class="i-send"></i></button>
    </form>
  </section>

  <!-- VIEWER -->
  <aside id="doc-viewer" class="viewer">
    <header class="viewer-head">
      <span id="doc-title">Document Viewer (0)</span>
      <button id="viewer-close" title="Close">✕</button>
    </header>
    <div id="viewer-empty" class="viewer-empty">
      <div class="empty-icon" aria-hidden="true">
        <svg viewBox="0 0 48 48" focusable="false">
          <path d="M14 6h15l9 9v27H14z"></path>
          <path d="M29 6v10h9"></path>
          <path d="M20 24h14M20 31h14M20 38h9"></path>
        </svg>
      </div>
      <h3>Document Viewer</h3>
      <p>Open a reference document from the chat to preview it here.</p>
      <!-- <div class="viewer-empty-note">💡 References from AI responses will appear here.</div> -->
    </div>
    <iframe id="doc-frame"></iframe>
  </aside>
</main>

<footer class="page-foot">Powered by Safe Lane IT</footer>

<!-- HISTORY PANEL -->
<div id="history-pane" class="history-pane glass closed">
  <header>
    <span>Chat History</span>
    <button id="history-close">✕</button>
  </header>
  <nav id="thread-list"></nav>
</div>

<!-- libs + logic -->
<script src="https://cdn.jsdelivr.net/npm/showdown@1.9.1/dist/showdown.min.js"></script>

<!-- tenant bootstrap (auto-detects client from URL) -->
<script>
(() => {
  // 1. Figure out path segments, e.g. "" | "maran" | "smsrag" "rsms"
  const pathSegments = location.pathname.split('/').filter(Boolean);

  // This app is served two ways:
  //  - at the domain root:       chatai.sl-sail.com/<tenant>
  //  - behind an nginx prefix:   viqmap.sl-sail.com/smsrag/<tenant>
  // so the tenant slug is either the 1st or 2nd path segment depending on
  // whether the "smsrag" mount prefix is present.
  const mountPrefix = pathSegments[0] === 'smsrag' ? 'smsrag' : '';
  const slug = mountPrefix ? (pathSegments[1] || '') : (pathSegments[0] || '');

  // 2. Normalise special cases (root = RSMS)
  const clientId   = slug || 'rsms';        // rsms / maran / supereco / …

  // 3. Build API base ->  /api                  (rsms, root mount)
  //                       /maran/api            (maran, root mount)
  //                       /smsrag/rsms/api      (rsms, /smsrag mount)
  window.API_BASE      = mountPrefix ? `/${mountPrefix}/${clientId}/api` : `/${clientId}/api`;
  window.MOUNT_PREFIX  = mountPrefix;

  // 4. Pretty label for the UI badge
  window.CLIENT_LABEL  = clientId.toUpperCase();
  window.CLIENT_ID     = clientId;
})();
</script>


<script src="/script.js"></script>
<script src="/feedback-integration.js"></script>
</body>
</html>
